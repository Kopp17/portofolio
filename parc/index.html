<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🖥️%3C/text%3E%3C/svg%3E">
<title>Parc IT — Démo gestion de parc informatique</title>
<style>
:root{--b:#12355b;--o:#e8832a;--g:#f3f5f8}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:var(--g);color:#222}
nav{background:var(--b);padding:12px 20px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav b{color:var(--o);margin-right:auto;font-size:18px}nav button{background:none;border:0;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px;transition:.3s}
nav button.on,nav button:hover{background:var(--o)}
main{max-width:980px;margin:20px auto;padding:0 14px}.v{display:none;animation:in .5s both}.v.on{display:block}@keyframes in{from{opacity:0;transform:translateY(22px)}}
.note{background:#fff3e6;border-left:4px solid var(--o);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
.card{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-left:4px solid var(--o);padding:14px;border-radius:8px;transition:.3s;animation:in .6s both}.stat:hover{transform:translateY(-5px);box-shadow:0 8px 18px #0003}
.stat strong{font-size:30px;display:block;color:var(--b)}
table{width:100%;border-collapse:collapse}th,td{padding:9px;text-align:left;border-bottom:1px solid #e3e6ea;font-size:14px}tr{animation:in .4s both}
input,select{padding:9px;font-size:14px;border:1px solid #c5ccd6;border-radius:6px}
button.act{background:var(--b);color:#fff;border:0;padding:9px 16px;border-radius:6px;cursor:pointer;transition:.2s}button.act:hover{background:var(--o);transform:scale(1.05)}
.f{display:flex;gap:8px;flex-wrap:wrap}.f>*{flex:1;min-width:130px}
.tag{padding:2px 9px;border-radius:10px;font-size:12px;color:#fff}.Haute{background:#c0392b}.Moyenne{background:#e8832a}.Basse{background:#2e8b57}
.w{overflow-x:auto}

#kp{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,#ff6a1f,#ffc247,#4cc26b);z-index:9999;pointer-events:none}
#kg{position:fixed;top:0;left:0;width:400px;height:400px;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle,#ffc24733,transparent 65%);mix-blend-mode:screen;transition:transform .12s linear}
.kw{display:inline-block;opacity:0;transform:translateY(70%) rotate(7deg);transition:transform .9s cubic-bezier(.2,1.4,.3,1),opacity .6s;transition-delay:calc(var(--i)*70ms);white-space:pre}
.kon .kw{opacity:1;transform:none}
.kgal{position:relative;z-index:2}.kgal .kl{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.7;margin-bottom:14px;text-align:center}.kgal h2{text-align:center;margin-bottom:40px}
.gal{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(110px,15vw,210px);gap:16px;max-width:1150px;margin:auto}
.gal .ph:nth-child(1){grid-column:1/8;grid-row:1/3}.gal .ph:nth-child(2){grid-column:8/13;grid-row:1/2}.gal .ph:nth-child(3){grid-column:8/13;grid-row:2/4}.gal .ph:nth-child(4){grid-column:1/8;grid-row:3/4}
.ph{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(135deg,#3a3a3a,#161616)}
.ph img{position:absolute;inset:-12% 0;width:100%;height:124%;object-fit:cover;transition:filter .6s,clip-path 1.4s cubic-bezier(.7,0,.2,1);clip-path:inset(0 0 100% 0);will-change:transform}.ph.on img{clip-path:inset(0)}.ph:hover img{filter:saturate(1.3) brightness(1.08)}
.ph figcaption{position:absolute;left:18px;bottom:14px;z-index:2;color:#fff;font:800 clamp(16px,2.2vw,26px) 'Arial Black',Arial,sans-serif;text-shadow:0 2px 14px #000b;transform:translateY(30px);opacity:0;transition:.8s .5s}.ph.on figcaption{transform:none;opacity:1}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,#0008);pointer-events:none}
.ph.nf img{display:none}.ph.nf::before{content:attr(data-e);position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,7vw,80px);animation:kf 3s ease-in-out infinite}@keyframes kf{50%{transform:scale(1.2) rotate(6deg)}}
@media(max-width:700px){.gal{grid-template-columns:1fr;grid-auto-rows:210px}.gal .ph:nth-child(n){grid-column:1;grid-row:auto}}
#ki{position:fixed;inset:0;z-index:99999;background:var(--kb,#08110d);display:grid;place-items:center;text-align:center;color:#fff;transition:clip-path 1s cubic-bezier(.8,0,.2,1);clip-path:inset(0)}#ki.out{clip-path:inset(0 0 100% 0)}
#ki b{font-size:76px;display:block;animation:kj .6s ease-in-out infinite alternate}@keyframes kj{to{transform:translateY(-14px) rotate(-8deg)}}#ki h1{font:800 clamp(30px,6vw,60px) 'Arial Black',Arial;margin:10px 0 18px}#ki i{display:block;height:4px;width:0;margin:auto;background:var(--ka,#2ee59d);animation:kl 1.4s ease-out forwards}@keyframes kl{to{width:200px}}
.kbl{position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.35;pointer-events:none;animation:kd 14s ease-in-out infinite alternate}@keyframes kd{to{transform:translate(18vw,12vh) scale(1.3)}}
@media(prefers-reduced-motion:reduce){.kw,.ph,.ph figcaption{opacity:1!important;transform:none!important;clip-path:none!important;transition:none!important}}
</style></head><body>
<nav><b>🖥️ Parc IT</b><button class="on" data-v="d">Tableau de bord</button><button data-v="e">Équipements</button><button data-v="t">Tickets</button><button id="csv">Export CSV</button></nav>
<main>
<div class="note">Démo en JavaScript de mon application Python (Flask + SQLite). Les données restent dans votre navigateur. <a href="https://github.com/kopp17/gestion-parc-it" target="_blank" rel="noopener">Voir le code Python</a></div>
<div class="v on" id="d"><h2 style="margin-bottom:14px">Tableau de bord</h2><div class="stats" id="st"></div><div class="card"><h3 style="margin-bottom:8px">Tickets urgents en attente</h3><table id="ur"></table></div></div>
<div class="v" id="e"><h2 style="margin-bottom:14px">Équipements</h2><div class="card"><div class="f"><input id="en" placeholder="Nom (ex : PC Comptabilité 02)"><select id="et"><option>Ordinateur</option><option>Imprimante</option><option>Routeur</option><option>Téléphone</option><option>Serveur</option><option>Autre</option></select><input id="el" placeholder="Localisation"><button class="act" id="ea">Ajouter</button></div></div><div class="card w"><table><tr><th>#</th><th>Nom</th><th>Type</th><th>Lieu</th><th></th></tr><tbody id="er"></tbody></table></div></div>
<div class="v" id="t"><h2 style="margin-bottom:14px">Tickets d'assistance</h2><div class="card"><div class="f"><input id="tt" placeholder="Problème (ex : Imprimante bloquée)"><select id="te"></select><select id="tp"><option>Basse</option><option selected>Moyenne</option><option>Haute</option></select><button class="act" id="ta">Créer</button></div></div>
<p style="margin-bottom:10px">Filtrer : <select id="tf"><option value="">Tous</option><option>Ouvert</option><option>En cours</option><option>Résolu</option></select></p>
<div class="card w"><table><tr><th>#</th><th>Titre</th><th>Équipement</th><th>Priorité</th><th>Date</th><th>Statut</th></tr><tbody id="tr"></tbody></table></div></div>
</main>
<script>
const $=s=>document.querySelector(s),K='parc-demo-v1',ST=['Ouvert','En cours','Résolu'];
const seed=()=>({e:[[1,'PC Comptabilité 01','Ordinateur','Bureau 2'],[2,'PC Direction','Ordinateur','Bureau 1'],[3,'Imprimante HP LaserJet','Imprimante','Accueil'],[4,'Routeur Wi-Fi principal','Routeur','Salle serveur'],[5,'Serveur fichiers','Serveur','Salle serveur'],[6,'Téléphone IP Secrétariat','Téléphone','Accueil']].map(x=>({id:x[0],n:x[1],t:x[2],l:x[3]})),
t:[[1,'Imprimante bloquée, bourrage papier',3,'Haute','Ouvert'],[2,'Connexion Wi-Fi instable',4,'Haute','En cours'],[3,'Installation de Microsoft Office',1,'Moyenne','En cours'],[4,'Sauvegarde hebdomadaire à vérifier',5,'Basse','Résolu'],[5,'Antivirus à renouveler',2,'Moyenne','Ouvert']].map(x=>({id:x[0],ti:x[1],e:x[2],p:x[3],s:x[4],d:'05/10/2026'}))});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||seed();const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const nm=id=>(D.e.find(x=>x.id==id)||{}).n||'-',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function count(el,n){let i=0;const s=Math.max(1,Math.ceil(n/20));const t=setInterval(()=>{i=Math.min(n,i+s);el.textContent=i;if(i>=n)clearInterval(t)},35)}
function dash(){const c=[['Équipements',D.e.length],...ST.map(s=>['Tickets : '+s,D.t.filter(t=>t.s==s).length])];
$('#st').innerHTML=c.map((x,i)=>`<div class="stat" style="animation-delay:${i*.1}s"><strong>0</strong>${x[0]}</div>`).join('');document.querySelectorAll('.stat strong').forEach((e,i)=>count(e,c[i][1]));
const u=D.t.filter(t=>t.s!='Résolu'&&t.p=='Haute');$('#ur').innerHTML=u.length?u.map(t=>`<tr><td>#${t.id}</td><td>${esc(t.ti)}</td><td>${esc(nm(t.e))}</td><td>${t.s}</td></tr>`).join(''):'<tr><td>Aucun ticket urgent.</td></tr>'}
function eq(){$('#er').innerHTML=D.e.map((x,i)=>`<tr style="animation-delay:${i*.05}s"><td>${x.id}</td><td>${esc(x.n)}</td><td>${x.t}</td><td>${esc(x.l)}</td><td><button class="act" data-del="${x.id}">Supprimer</button></td></tr>`).join('');
$('#te').innerHTML='<option value="">Équipement (facultatif)</option>'+D.e.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join('')}
function tk(){const f=$('#tf').value;$('#tr').innerHTML=D.t.filter(t=>!f||t.s==f).slice().reverse().map((t,i)=>`<tr style="animation-delay:${i*.05}s"><td>${t.id}</td><td>${esc(t.ti)}</td><td>${esc(nm(t.e))}</td><td><span class="tag ${t.p}">${t.p}</span></td><td>${t.d}</td><td><select data-st="${t.id}">${ST.map(s=>`<option ${s==t.s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6">Aucun ticket.</td></tr>'}
const all=()=>{dash();eq();tk()};
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.v').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.v).classList.add('on');all()});
$('#ea').onclick=()=>{const n=$('#en').value.trim();if(!n)return;D.e.push({id:Date.now()%1e6,n,t:$('#et').value,l:$('#el').value.trim()});save();$('#en').value=$('#el').value='';eq()};
$('#ta').onclick=()=>{const ti=$('#tt').value.trim();if(!ti)return;D.t.push({id:(Math.max(0,...D.t.map(x=>x.id))+1),ti,e:$('#te').value,p:$('#tp').value,s:'Ouvert',d:new Date().toLocaleDateString('fr-FR')});save();$('#tt').value='';tk()};
$('#tf').onchange=tk;
document.addEventListener('click',e=>{if(e.target.dataset.del&&confirm('Supprimer ?')){D.e=D.e.filter(x=>x.id!=e.target.dataset.del);save();eq();tk()}});
document.addEventListener('change',e=>{if(e.target.dataset.st){D.t.find(t=>t.id==e.target.dataset.st).s=e.target.value;save()}});
$('#csv').onclick=()=>{const r=['ID;Titre;Équipement;Priorité;Statut;Date',...D.t.map(t=>[t.id,t.ti,nm(t.e),t.p,t.s,t.d].join(';'))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r],{type:'text/csv'}));a.download='tickets.csv';a.click()};
all();
</script><script>/*KITDONE*/(function(o){
const $=(s)=>document.querySelectorAll(s);
if(o.intro){const d=document.createElement('div');d.id='ki';d.style.setProperty('--kb',o.intro[2]);d.style.setProperty('--ka',o.intro[3]);d.innerHTML='<div><b>'+o.intro[1]+'</b><h1>'+o.intro[0]+'</h1><i></i></div>';document.body.prepend(d);setTimeout(()=>d.classList.add('out'),1600);setTimeout(()=>d.remove(),2800);
 [[o.intro[3],'8vw','10vh',380],['#6aa8ff','60vw','50vh',320]].forEach(a=>{const b=document.createElement('div');b.className='kbl';b.style.cssText='background:'+a[0]+';left:'+a[1]+';top:'+a[2]+';width:'+a[3]+'px;height:'+a[3]+'px';document.body.append(b)})}
let bar;if(!o.noprog){bar=document.createElement('div');bar.id='kp';document.body.append(bar)}
if(!o.noglow&&matchMedia('(hover:hover)').matches){const g=document.createElement('div');g.id='kg';document.body.append(g);addEventListener('mousemove',e=>{g.style.transform='translate('+(e.clientX-200)+'px,'+(e.clientY-200)+'px)'})}
function split(el){let i=0;(function w(n){[...n.childNodes].forEach(c=>{if(c.nodeType==3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(!t.trim())f.append(t);else{const s=document.createElement('span');s.className='kw';s.style.setProperty('--i',i++);s.textContent=t;f.append(s)}});c.replaceWith(f)}else if(c.nodeType==1&&!c.classList.contains('kw'))w(c)})})(el)}
const hs=[...$('h2')].filter(h=>!h.closest('#ld,#ki,#lb'));hs.forEach(split);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;e.target.classList.add(e.target.tagName=='H2'?'kon':'on');io.unobserve(e.target)}),{threshold:.2});
hs.forEach(h=>io.observe(h));const phs=[...$('.ph')];phs.forEach(p=>io.observe(p));
(function f(){if(bar)bar.style.width=scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100+'%';
 phs.forEach(p=>{const i=p.querySelector('img');if(!i)return;const r=p.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;i.style.transform='translateY('+((r.top+r.height/2-innerHeight/2)/innerHeight*-60)+'px) scale('+(p.classList.contains('on')?1.05:1.3)+')'});requestAnimationFrame(f)})();
if(!o.nomag&&matchMedia('(hover:hover)').matches)$(o.mag||'.bt,.cta').forEach(b=>{b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();b.style.transform='translate('+(e.clientX-r.left-r.width/2)*.22+'px,'+(e.clientY-r.top-r.height/2)*.32+'px)'});b.addEventListener('mouseleave',()=>b.style.transform='')});
})({intro:['Parc IT','🖥️','#12355b','#e8832a'],noglow:1,mag:'.act'});</script></body></html>
